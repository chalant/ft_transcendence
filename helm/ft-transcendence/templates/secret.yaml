{{- if not .Values.secrets.existingSecret }}
{{- $name := include "ft.secretName" . }}
{{- $stored := dict }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $stored = .data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ft.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    # keep the generated passwords if the release is uninstalled: the database
    # volume still expects them.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | b64enc | quote }}
  POSTGRES_PASSWORD: {{ include "ft.secretValue" (list $stored "POSTGRES_PASSWORD" .Values.secrets.postgresPassword) }}
  DJANGO_SECRET_KEY: {{ include "ft.secretValue" (list $stored "DJANGO_SECRET_KEY" .Values.secrets.djangoSecretKey) }}
  JWT_SECRET_KEY: {{ include "ft.secretValue" (list $stored "JWT_SECRET_KEY" .Values.secrets.jwtSecretKey) }}
  CLIENT_SECRET: {{ .Values.secrets.oauthClientSecret | b64enc | quote }}
{{- end }}
