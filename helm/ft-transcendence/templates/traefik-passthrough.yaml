{{- if .Values.traefik.passthrough.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: proxy-server
  labels:
    {{- include "ft.labels" (dict "root" . "component" "proxy-server") | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.traefik.passthrough.entryPoint }}
  routes:
    - match: HostSNI(`{{ .Values.traefik.passthrough.hostSNI }}`)
      services:
        - name: proxy-server
          port: {{ .Values.proxy.service.port }}
  tls:
    passthrough: true
{{- end }}
