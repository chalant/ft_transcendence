{{- $component := "game-server" }}
apiVersion: v1
kind: Service
metadata:
  name: game-server
  labels:
    {{- include "ft.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  selector:
    {{- include "ft.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  labels:
    {{- include "ft.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  # game sessions live in this process's memory: a second replica would split
  # the players of a room, and a rolling update would run two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ft.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ft.labels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      {{- include "ft.pullSecrets" . | nindent 6 }}
      containers:
        - name: game-server
          image: {{ include "ft.image" .Values.gameServer.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "ft.env.ipAddress" . | nindent 12 }}
            {{- include "ft.env.postgres" . | nindent 12 }}
            {{- include "ft.env.django" . | nindent 12 }}
          {{- include "ft.httpProbes" (dict "port" "http") | nindent 10 }}
          resources:
            {{- toYaml .Values.gameServer.resources | nindent 12 }}
