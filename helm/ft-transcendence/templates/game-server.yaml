{{- $component := "game-server" }}
apiVersion: v1
kind: Service
metadata:
  name: game-server
  labels:
    {{- include "ft.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  # headless: DNS answers with every ready pod address, which the proxy needs
  # to route rooms to a specific replica (a ClusterIP would load-balance).
  clusterIP: None
  selector:
    {{- include "ft.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  labels:
    {{- include "ft.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  # game sessions live in the memory of one replica: the proxy pins every
  # websocket of a room to one pod (consistent hash of the room name over the
  # pod addresses from the headless Service). A rolling update would run old
  # and new pods together and remap rooms, hence Recreate.
  replicas: {{ .Values.gameServer.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ft.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ft.labels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      {{- include "ft.pullSecrets" . | nindent 6 }}
      containers:
        - name: game-server
          image: {{ include "ft.image" .Values.gameServer.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "ft.env.ipAddress" . | nindent 12 }}
            {{- include "ft.env.postgres" . | nindent 12 }}
            {{- include "ft.env.django" . | nindent 12 }}
          {{- include "ft.httpProbes" (dict "port" "http") | nindent 10 }}
          resources:
            {{- toYaml .Values.gameServer.resources | nindent 12 }}
