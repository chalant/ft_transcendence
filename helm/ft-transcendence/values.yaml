# Hostname or IP browsers use to reach the site (same as IP_ADDRESS in src/.env).
# The app must be served on port 443 at this address: the frontend opens
# wss://<ipAddress>/ws/... without a port and Django validates the host against it.
ipAddress: localhost

# Applies to every container. IfNotPresent works with images imported into the
# cluster's container runtime (e.g. `make k3s-images`) as well as registry images.
imagePullPolicy: IfNotPresent
imagePullSecrets: []

secrets:
  # Use an existing Secret instead of the one generated by the chart. It must
  # contain the keys POSTGRES_USER, POSTGRES_PASSWORD, DJANGO_SECRET_KEY,
  # JWT_SECRET_KEY and CLIENT_SECRET.
  existingSecret: ""
  postgresUser: transcendence
  # Left empty, these are generated once and kept across upgrades.
  postgresPassword: ""
  djangoSecretKey: ""
  jwtSecretKey: ""
  # 42 OAuth ("Log in with 42"). Optional.
  oauthClientSecret: ""

oauth:
  clientId: ""
  # Defaults to https://<ipAddress>/auth/auth42/
  redirectUri: ""

proxy:
  image:
    repository: proxy-server-image
    tag: latest
  service:
    # LoadBalancer exposes port 443 directly. On k3s Traefik already holds 443:
    # use ClusterIP with traefik.passthrough.enabled instead (see values-k3s.yaml).
    type: LoadBalancer
    port: 443
    # Only used when type is NodePort.
    nodePort: null
    annotations: {}
  resources: {}

website:
  image:
    repository: website-image
    tag: latest
  resources: {}

users:
  image:
    repository: users-image
    tag: latest
  persistence:
    # Stores uploaded profile pictures.
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources: {}

gameServer:
  image:
    repository: game-server-image
    tag: latest
  # Pause timeout and live game sessions are held in memory: the game server
  # always runs as a single replica.
  resources: {}

matchmaking:
  image:
    repository: matchmaking-image
    tag: latest
  replicas: 2
  resources: {}

postgresql:
  image:
    repository: postgresql-image
    tag: latest
  persistence:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources: {}

redis:
  image:
    repository: redis
    tag: alpine
  resources: {}

traefik:
  # Route Traefik's websecure entrypoint (443) to the proxy with TLS passthrough,
  # so nginx keeps terminating TLS and routing exactly as in docker compose.
  # Requires the Traefik CRDs (bundled with k3s).
  passthrough:
    enabled: false
    entryPoint: websecure
    # "*" catches every TLS connection on the entrypoint, including clients that
    # send no SNI (IP addresses, localhost). Set to ipAddress when it is a real
    # hostname and other apps share the Traefik entrypoint.
    hostSNI: "*"
