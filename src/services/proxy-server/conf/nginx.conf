# Global settings
user  nginx;
worker_processes  1;

# Events block
events {
    worker_connections  1024;
}

# HTTP block
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket tokens travel in the query string: log $uri, never $request.
    log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Server block(s)
    server {
		listen 443 ssl;
		listen [::]:443 ssl;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_certificate /etc/nginx/ssl/ft_transcendence.crt;
		ssl_certificate_key /etc/nginx/ssl/ft_transcendence.key;

		server_name ft_transcendence.com;

		# internal service-to-service endpoints: never reachable from outside.
		location ~ ^/(auth|users|friend|media|stat|games)/(create_user|get_picture|get_user|check_token|game_stats|internal|session|admin)(/|$) {
			return 404;
		}

		# website.
		location / {
			proxy_pass http://website:8000/;
			include /etc/nginx/proxy_params.conf;
		}

		location /auth/ {
			proxy_pass http://users:8000/;
			include /etc/nginx/proxy_params.conf;
		}

		location /users/ {
			proxy_pass http://users:8000/;
			include /etc/nginx/proxy_params.conf;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		location /friend/ {
			proxy_pass http://users:8000/;
			include /etc/nginx/proxy_params.conf;
		}

		location /media/ {
			proxy_pass http://users:8000/;
			include /etc/nginx/proxy_params.conf;
		}

		location /stat/ {
			proxy_pass http://users:8000/;
			include /etc/nginx/proxy_params.conf;
		}

		location /games/ {
			proxy_pass http://matchmaking:8000/;
			include /etc/nginx/proxy_params.conf;
		}

		location /ws/ {
			proxy_pass http://game-server:8000/;
			include /etc/nginx/proxy_params.conf;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}
	}
}
