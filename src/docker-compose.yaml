services:
  proxy-server:
    container_name: proxy-server
    image:
      proxy-server-image
    build:
      context: services/proxy-server/
    ports:
      - "443:443"
    networks:
      - transcendence
    depends_on:
      - website
      - game-server
    restart: always

  users:
    container_name: users
    image:
      users-image
    build:
      context: services/users/
    environment:
      IP_ADDRESS : "${IP_ADDRESS}"
      POSTGRES_USER : "${POSTGRES_USER}"
      POSTGRES_PASSWORD : "${POSTGRES_PASSWORD}"
      CLIENT_ID : "${CLIENT_ID}"
      CLIENT_SECRET : "${CLIENT_SECRET}"
      REDIRECT_URI : "${REDIRECT_URI}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
    networks:
      - transcendence
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # the port only opens once migrations are applied and uvicorn is up.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 3s
      timeout: 3s
      retries: 60
    volumes:
      - profile-pictures-data:/home/service/media/profile_pictures
    restart: always

  website:
    container_name: website
    image:
      website-image
    build:
      context: services/website/
    depends_on:
      - users
    networks:
      - transcendence
    environment:
      IP_ADDRESS : "${IP_ADDRESS}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
    restart: always

  game-server:
    container_name: game-server
    image:
      game-server-image
    build:
      context: services/game-server/
      dockerfile: Dockerfile
    depends_on:
      postgresql:
        condition: service_healthy
      users:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - transcendence
    environment:
      IP_ADDRESS : "${IP_ADDRESS}"
      POSTGRES_USER : "${POSTGRES_USER}"
      POSTGRES_PASSWORD : "${POSTGRES_PASSWORD}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
    restart: always

  postgresql:
    container_name: postgresql
    image:
      postgresql-image
    build:
      context: services/postgreSQL
    networks:
      - transcendence
    environment:
      POSTGRES_USER : "${POSTGRES_USER}"
      POSTGRES_PASSWORD : "${POSTGRES_PASSWORD}"
    healthcheck:
      # -h forces TCP: during first-boot init the temporary server only listens
      # on the unix socket, and the databases are created after it.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: "redis:alpine"
    container_name: 'redis'
    networks:
      - transcendence
    restart: always

networks:
  transcendence:
    driver: bridge

volumes:
  postgres-data:
  profile-pictures-data:
